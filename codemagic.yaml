workflows:
  noora-android-debug:
    name: NOORA Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build NOORA Debug APK
        script: |
          set -e
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            GRADLE_VERSION=8.7
            curl -L --fail -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-${GRADLE_VERSION}/bin/gradle assembleDebug
          fi
    artifacts:
      - app/build/outputs/**/*.apk
